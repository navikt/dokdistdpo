kind: Application
apiVersion: nais.io/v1alpha1
metadata:
  name: {{ APP_NAME }}
  namespace: teamdokumenthandtering
  labels:
    team: teamdokumenthandtering
spec:
  env:
    - name: DOKDISTDPO_ENDPOINTS_DOKDISTADMIN_URL
      value: {{ DOKDISTDPO_ENDPOINTS_DOKDISTADMIN_URL }}
    - name: DOKDISTDPO_ENDPOINTS_DOKDISTADMIN_SCOPE
      value: {{ DOKDISTDPO_ENDPOINTS_DOKDISTADMIN_SCOPE }}
    - name: DOKDISTDPO_SERVICEREGISTRY_URL
      value: {{ DOKDISTDPO_SERVICEREGISTRY_URL }}
    - name: DOKDISTDPO_JURIDISKLOGG_URL
      value: {{ DOKDISTDPO_JURIDISKLOGG_URL }}
    - name: DOKDISTDPO_ALTINN_BROKERSERVICEEXTERNAL_ENDPOINTURL
      value: {{ DOKDISTDPO_ALTINN_BROKERSERVICEEXTERNAL_ENDPOINTURL }}
    - name: DOKDISTDPO_ALTINN_BROKERSERVICEEXTERNALSTREAMED_ENDPOINTURL
      value: {{ DOKDISTDPO_ALTINN_BROKERSERVICEEXTERNALSTREAMED_ENDPOINTURL }}
    - name: DOKDISTDPO_ALTINN_SERVICE_CODE
      value: {{ DOKDISTDPO_ALTINN_SERVICE_CODE }}
    - name: DOKDISTDPO_ALTINN_SERVICE_EDITION_CODE
      value: {{ DOKDISTDPO_ALTINN_SERVICE_EDITION_CODE }}
    - name: NAV_VIRKSOMHETSSERTIFIKAT_CREDENTIALS
      value: {{ NAV_VIRKSOMHETSSERTIFIKAT_CREDENTIALS }}
    - name: NAV_VIRKSOMHETSSERTIFIKAT_KEY
      value: {{ NAV_VIRKSOMHETSSERTIFIKAT_KEY }}
    - name: DOKDISTMELLOMLAGER_PROJECTID
      value: {{ DOKDISTMELLOMLAGER_PROJECTID }}
    - name: DOKDISTMELLOMLAGER_BUCKET
      value: {{ DOKDISTMELLOMLAGER_BUCKET }}
    - name: DOKDISTMELLOMLAGER_KEYRING
      value: {{ DOKDISTMELLOMLAGER_KEYRING }}
    - name: DOKDISTMELLOMLAGER_KEYID
      value: {{ DOKDISTMELLOMLAGER_KEYID }}
    - name: OTEL_RESOURCE_ATTRIBUTES
      value: "deployment.environment.name={{ ENVIRONMENT }}"
    - name: DOKDISTDPO_MQ_GATEWAY_MANAGER_NAME
      value: {{ DOKDISTDPO_MQ_GATEWAY_MANAGER_NAME }}
    - name: DOKDISTDPO_MQ_GATEWAY_CHANNEL_NAME
      value: {{ DOKDISTDPO_MQ_GATEWAY_CHANNEL_NAME }}
    - name: DOKDISTDPO_MQ_GATEWAY_HOSTNAME
      value: {{ DOKDISTDPO_MQ_GATEWAY_HOSTNAME }}
    - name: DOKDISTDPO_MQ_GATEWAY_PORT
      value: "{{ DOKDISTDPO_MQ_GATEWAY_PORT }}"
    - name: DOKDISTDPO_QDIST015_DIST_TIL_DPO_QUEUENAME
      value: {{ DOKDISTDPO_QDIST015_DIST_TIL_DPO_QUEUENAME }}
    - name: DOKDISTDPO_QDIST015_FUNK_FEIL_QUEUENAME
      value: {{ DOKDISTDPO_QDIST015_FUNK_FEIL_QUEUENAME }}
    - name: DOKDISTSENTRALPRINT_QDIST009_DIST_S_PRINT_QUEUENAME
      value: {{ DOKDISTSENTRALPRINT_QDIST009_DIST_S_PRINT_QUEUENAME }}
  image: {{ image }}
  ingresses:
    {{#each INGRESSES}}
       - {{this }}
      {{/each}}
  liveness:
    path: /actuator/health/liveness
    port: 8080
    initialDelay: 30
    failureThreshold: 10
  port: 8080
  webproxy: true
  leaderElection: true
  prometheus:
    enabled: true
    path: /actuator/prometheus
  readiness:
    path: /actuator/health/readiness
    port: 8080
    initialDelay: 30
    timeout: 3
  replicas:
    min: {{ MIN_REPLICAS }}
    max: {{ MAX_REPLICAS }}
    cpuThresholdPercentage: 50
  resources:
    limits:
      memory: 3Gi
    requests:
      memory: 1Gi
  observability:
    autoInstrumentation:
      enabled: true
      runtime: java
      destinations:
        - id: "elastic-apm"
    logging:
      destinations:
        - id: elastic
        - id: loki
  maskinporten:
    enabled: true
    scopes:
      consumes:
        - name: move/dpo.read
  azure:
    application:
      enabled: true
  filesFrom:
    - secret: {{ DOKDISTDPO_SECRET }}
      mountPath: /var/run/secrets/nais.io/dokdistdpo
  vault:
    enabled: true
    paths:
      - kvPath: {{ NAV_VIRKSOMHETSSERTIFIKAT_VAULT }}
        mountPath: "/secrets/virksomhetssertifikat"
      - kvPath: {{ SRVDOKDISTDPO }}
        mountPath: "/secrets/serviceuser/srvdokdistdpo"
  accessPolicy:
    outbound:
      rules:
        - application: logging
          namespace: nais-system