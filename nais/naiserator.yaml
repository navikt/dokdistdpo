kind: Application
apiVersion: nais.io/v1alpha1
metadata:
  name: {{ APP_NAME }}
  namespace: teamdokumenthandtering
  labels:
    team: teamdokumenthandtering
spec:
  env:
    - name: DOKDISTDPO_ENDPOINTS_DOKDISTADMIN_URL
      value: {{ DOKDISTDPO_ENDPOINTS_DOKDISTADMIN_URL }}
    - name: DOKDISTDPO_ENDPOINTS_DOKDISTADMIN_SCOPE
      value: {{ DOKDISTDPO_ENDPOINTS_DOKDISTADMIN_SCOPE }}
    - name: DOKDISTDPO_SERVICEREGISTRY_URL
      value: {{ DOKDISTDPO_SERVICEREGISTRY_URL }}
    - name: NAV_VIRKSOMHETSSERTIFIKAT_CREDENTIALS
      value: {{ NAV_VIRKSOMHETSSERTIFIKAT_CREDENTIALS }}
    - name: NAV_VIRKSOMHETSSERTIFIKAT_KEY
      value: {{ NAV_VIRKSOMHETSSERTIFIKAT_KEY }}
    - name: OTEL_RESOURCE_ATTRIBUTES
      value: "deployment.environment.name={{ ENVIRONMENT }}"
  image: {{ image }}
  ingresses:
    {{#each INGRESSES}}
       - {{this }}
      {{/each}}
  liveness:
    path: /actuator/health/liveness
    port: 8080
    initialDelay: 30
    failureThreshold: 10
  port: 8080
  webproxy: true
  leaderElection: true
  prometheus:
    enabled: true
    path: /actuator/prometheus
  readiness:
    path: /actuator/health/readiness
    port: 8080
    initialDelay: 30
    timeout: 3
  replicas:
    min: {{ MIN_REPLICAS }}
    max: {{ MAX_REPLICAS }}
    cpuThresholdPercentage: 50
  resources:
    limits:
      memory: 3Gi
    requests:
      memory: 1Gi
  observability:
    autoInstrumentation:
      enabled: true
      runtime: java
      destinations:
        - id: "elastic-apm"
  maskinporten:
    enabled: true
    scopes:
      consumes:
        - name: move/dpo.read
  azure:
    application:
      enabled: true
  vault:
    enabled: true
    paths:
      - kvPath: {{ NAV_VIRKSOMHETSSERTIFIKAT_VAULT }}
        mountPath: "/secrets/virksomhetssertifikat"