spring.main.banner-mode=off
# Actuator
management.endpoints.web.exposure.include=prometheus,health

# actuator - health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-components=always
management.endpoint.health.show-details=always
management.endpoint.health.group.liveness.include=jms

#Altinn Brokerservice
dokdistdpo.altinn.brokerserviceexternal.readtimeoutms=30000
dokdistdpo.altinn.brokerserviceexternal.connecttimeoutms=5000

dokdistdpo.altinn.brokerserviceexternalstreamed.readtimeoutms=60000
dokdistdpo.altinn.brokerserviceexternalstreamed.connecttimeoutms=5000